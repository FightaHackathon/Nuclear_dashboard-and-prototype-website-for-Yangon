<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMR Nexus | 24/7 Industrial & Urban Power</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              tech: ['Orbitron', 'sans-serif'],
            },
            colors: {
              atom: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6',
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              },
              nuclear: {
                accent: '#00E5FF',
                glow: 'rgba(0, 229, 255, 0.5)',
              }
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'data-update': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1)',
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #042f2e;
      }
      ::-webkit-scrollbar-thumb {
        background: #14b8a6;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2dd4bf;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      
      /* Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #2dd4bf;
        cursor: pointer;
        margin-top: -6px; 
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #1e293b;
        border-radius: 2px;
      }
      .custom-scrollbar {
          scrollbar-width: thin;
          scrollbar-color: #14b8a6 #0f172a;
      }

      /* Dashboard Specific Animations */
      .gauge-container {
        position: relative;
        overflow: hidden;
      }
      
      .gauge-progress {
        transition: width 0.5s ease-out, background-color 0.3s ease;
      }

      .control-rod-container {
        position: relative;
        height: 160px;
        width: 32px;
        background: linear-gradient(to bottom, #334155, #1e293b);
        border-radius: 9999px; /* full rounded */
        overflow: hidden;
        border: 1px solid #475569;
      }

      .control-rod {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: linear-gradient(to bottom, #f43f5e, #be123c);
        border-top-left-radius: 9999px;
        border-top-right-radius: 9999px;
        transition: height 0.3s ease-out;
        box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
      }
      
      /* Force hide Leaflet Attribution and any flag icons */
      .leaflet-control-attribution,
      .leaflet-control-container .leaflet-bottom.leaflet-right,
      .leaflet-control-attribution a,
      .leaflet-control-attribution svg {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        width: 0 !important;
        height: 0 !important;
        pointer-events: none !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",

    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.358.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.3?external=react,react-dom",
    "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
    "react-leaflet": "https://esm.sh/react-leaflet@4.2.1?external=react,react-dom,leaflet",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>

</head>

</body>
</html>
